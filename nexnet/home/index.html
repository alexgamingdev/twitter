<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexNet | Network Interface</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Orbitron:wght@700;900&family=Fira+Code&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/main.css">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#00e5ff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="NexNet">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <style>
        .post-card {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.07);
            border-radius: 16px;
            padding: 1.5rem;
            transition: border-color 0.3s ease;
        }
        .post-card:hover {
            border-color: rgba(0,229,255,0.2);
        }
        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent), var(--accent-dark));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: 700;
            color: #050505;
            flex-shrink: 0;
        }
        .compose-box {
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px;
            padding: 1.25rem;
            transition: border-color 0.3s ease;
        }
        .compose-box:focus-within {
            border-color: rgba(0,229,255,0.3);
        }
        .sidebar-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 12px;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-dim);
            text-decoration: none;
            transition: background 0.2s ease, color 0.2s ease;
        }
        .sidebar-item:hover, .sidebar-item.active {
            background: rgba(0,229,255,0.08);
            color: var(--accent);
        }
        .tag {
            font-size: 0.7rem;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 6px;
            background: rgba(0,229,255,0.1);
            color: var(--accent);
            border: 1px solid rgba(0,229,255,0.2);
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="px-4 md:px-8 py-4 flex justify-between items-center fixed w-full z-50" style="background: rgba(5,5,5,0.7); backdrop-filter: blur(16px); border-bottom: 1px solid rgba(255,255,255,0.06);">
        <div class="flex items-center gap-3">
            <img src="/logo.svg" width="28" height="28" alt="NexNet">
            <span class="orbitron text-base font-black tracking-widest text-white">NEX<span style="color:var(--accent)">NET</span></span>
        </div>
        <div class="flex items-center gap-3">
            <div class="hidden sm:flex items-center gap-2 px-3 py-1 rounded-full" style="background: rgba(0,229,255,0.08); border: 1px solid rgba(0,229,255,0.2);">
                <span class="w-1.5 h-1.5 rounded-full bg-[#00e5ff] animate-pulse"></span>
                <span class="text-[10px] font-semibold tracking-widest mono" style="color:var(--accent)">ONLINE</span>
            </div>
            <a href="/settings/" class="btn-nexus text-xs py-2 px-4">Settings</a>
            <button id="btn-pwa-install" style="display:none" class="items-center gap-1.5 text-xs font-semibold px-3 py-2 rounded-lg transition-all" aria-label="Install App">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                Install
            </button>
        </div>
    </nav>

    <div class="flex min-h-screen pt-16">
        <!-- Sidebar (hidden on mobile) -->
        <aside class="hidden md:block w-60 fixed h-full pt-6 px-4" style="border-right: 1px solid rgba(255,255,255,0.05);">
            <nav class="flex flex-col gap-1 mt-4">
                <a href="/home/" class="sidebar-item active">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                    Network Feed
                </a>
                <a href="/explore/" class="sidebar-item">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                    Explore Nodes
                </a>
                <a href="/notifications/" class="sidebar-item">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
                    Notifications
                </a>
                <a href="/settings/" class="sidebar-item">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93a10 10 0 0 1-14.14 0"/><path d="M4.93 19.07a10 10 0 0 1 0-14.14"/></svg>
                    Settings
                </a>
            </nav>

            <div class="mt-8 p-3 rounded-xl" style="background: rgba(0,229,255,0.05); border: 1px solid rgba(0,229,255,0.1);">
                <p class="text-[10px] font-bold uppercase tracking-widest mb-1" style="color:var(--accent)">Your Node</p>
                <a id="node-name-link" href="#" class="text-sm font-semibold text-white hover:opacity-70 block">—</a>
                <p id="node-name" class="hidden">—</p>
                <p class="text-[10px] mono mt-0.5" style="color:var(--text-dim)">Active · Online</p>
                <button id="btn-logout" class="mt-3 text-[10px] mono uppercase tracking-widest hover:opacity-70 transition-opacity w-full text-left" style="color:var(--text-dim)">← Disconnect</button>
            </div>
        </aside>

        <!-- Main Feed -->
        <main class="md:ml-60 flex-1 max-w-2xl px-4 md:px-6 py-6 mx-auto pb-20 md:pb-6">
            <!-- Compose -->
            <div class="compose-box mb-6">
                <div class="flex gap-3 items-start">
                    <div id="compose-avatar" class="avatar">?</div>
                    <textarea id="compose-input" class="flex-1 bg-transparent text-sm resize-none text-white placeholder-[rgba(255,255,255,0.25)] outline-none" rows="2" placeholder="Broadcast to the network..."></textarea>
                </div>
                <div class="flex justify-end mt-3 pt-3" style="border-top: 1px solid rgba(255,255,255,0.05)">
                    <button id="compose-btn" class="btn-nexus text-xs py-2 px-5">Transmit</button>
                </div>
            </div>

            <!-- Feed Posts — populated in real-time from Firestore -->
            <div id="feed" class="space-y-4">
                <p class="text-center text-xs mono pt-8" style="color:var(--text-dim)">Loading transmissions...</p>
            </div>
        </main>
    </div>

    <!-- Mobile bottom navigation -->
    <nav class="mobile-nav" aria-label="Mobile navigation">
        <a href="/home/" class="mobile-nav-item active">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            Feed
        </a>
        <a href="/explore/" class="mobile-nav-item">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            Explore
        </a>
        <a href="/notifications/" class="mobile-nav-item">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
            Alerts
        </a>
        <a href="/settings/" class="mobile-nav-item">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93a10 10 0 0 1-14.14 0"/><path d="M4.93 19.07a10 10 0 0 1 0-14.14"/></svg>
            Settings
        </a>
    </nav>


    <script src="/js/space.js"></script>
    <script src="/js/pwa-install.js"></script>
    <script type="module">
        import { initializeApp }        from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut }
            from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot,
                 query, orderBy, serverTimestamp, doc, getDoc, getDocs, updateDoc, increment,
                 where, writeBatch, setDoc }
            from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { firebaseConfig, profileFromEmail, verifiedBadgeHtml }
            from "/js/firebase-config.js";

        const app  = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db   = getFirestore(app);

        let currentUser    = null;
        let currentProfile = null;

        // ── Per-session caches ────────────────────────────────────────────────
        const profileCache = new Map();  // uid → Firestore profile data
        const likedPostIds = new Set();  // post IDs already liked by currentUser

        // Fetch and cache Firestore profiles for a list of UIDs (missing only)
        async function fetchProfiles(uids) {
            const missing = uids.filter(uid => !profileCache.has(uid));
            if (!missing.length) return;
            await Promise.all(missing.map(async uid => {
                try {
                    const snap = await getDoc(doc(db, "users", uid));
                    if (snap.exists()) profileCache.set(uid, snap.data());
                } catch (_) {}
            }));
        }

        // Load the set of post IDs the current user has already liked
        async function loadLikedPostIds() {
            if (!currentUser) return;
            try {
                const q    = query(collection(db, "post_likes"), where("uid", "==", currentUser.uid));
                const snap = await getDocs(q);
                snap.forEach(d => likedPostIds.add(d.data().postId));
            } catch (_) {}
        }

        // ── Auth Guard ────────────────────────────────────────────────────────
        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.replace("/login/");
                return;
            }
            if (!user.emailVerified) {
                const bypassSnap = await getDoc(doc(db, "users", user.uid));
                if (!bypassSnap.exists() || !bypassSnap.data().emailBypass) {
                    window.location.replace("/verify-email/");
                    return;
                }
            }
            currentUser = user;

            // Load profile from Firestore
            const profileSnap = await getDoc(doc(db, "users", user.uid));
            if (profileSnap.exists()) {
                currentProfile = profileSnap.data();
            } else {
                // Profile doc missing (e.g. created before the registration fix).
                // Auto-create it from Firebase Auth data so Settings can update it.
                // Append a UID suffix to the email-derived username to avoid collisions.
                const derived = profileFromEmail(user.email);
                derived.username = derived.username + '_' + user.uid.slice(0, 12);
                currentProfile = { uid: user.uid, email: user.email, ...derived, verified: false };
                await setDoc(doc(db, "users", user.uid), {
                    ...currentProfile,
                    createdAt: serverTimestamp()
                });
            }

            // Populate "Your Node" sidebar
            const nodeLink = document.getElementById('node-name-link');
            nodeLink.textContent = currentProfile.username;
            nodeLink.href        = `/profile/?uid=${encodeURIComponent(user.uid)}`;

            // Show actual profile picture in compose box if available
            const composeAvatar = document.getElementById('compose-avatar');
            if (currentProfile.avatarUrl) {
                composeAvatar.style.background = 'none';
                composeAvatar.style.padding    = '0';
                const img = document.createElement('img');
                img.className = 'w-full h-full rounded-full object-cover';
                img.alt       = '';
                img.src       = currentProfile.avatarUrl;
                composeAvatar.appendChild(img);
            } else {
                composeAvatar.textContent = currentProfile.avatarInitials;
            }

            // Wire logout button
            document.getElementById('btn-logout').addEventListener('click', () => signOut(auth));

            // Load the posts this user has already liked
            await loadLikedPostIds();

            // ── Real-time Feed (messages collection) ──────────────────────────
            const postsQuery = query(
                collection(db, "messages"),
                orderBy("createdAt", "desc")
            );

            onSnapshot(postsQuery, async (snapshot) => {
                // Fetch live profiles for all authors in one batch
                const authorUids = [...new Set(snapshot.docs.map(d => d.data().authorUid).filter(Boolean))];
                await fetchProfiles(authorUids);

                const feed = document.getElementById('feed');
                feed.innerHTML = '';
                snapshot.forEach((snap) => {
                    feed.appendChild(buildCard(snap.id, snap.data()));
                });
                if (snapshot.empty) {
                    feed.innerHTML = '<p class="text-center text-xs mono pt-8" style="color:var(--text-dim)">No transmissions yet. Be the first.</p>';
                }
            });
        });

        // ── Build post card DOM element ───────────────────────────────────────
        function buildCard(id, data) {
            const card = document.createElement('div');
            card.className = 'post-card';

            // Use live profile data (from cache) for author info and verification
            const authorProfile  = profileCache.get(data.authorUid);
            const authorName     = authorProfile?.displayName    || data.authorName     || '?';
            const authorUsername = authorProfile?.username       || data.authorUsername || '';
            const avatarInitials = authorProfile?.avatarInitials || data.authorInitials || '?';

            // Badge reflects the author's CURRENT verification, not what was stored at post time
            const isVerified = authorProfile?.verified && authorProfile?.verifiedType;
            const badge      = isVerified
                ? verifiedBadgeHtml(authorProfile.verifiedType, authorProfile.verifiedBy || null)
                : '';
            const tipMap     = { person: 'Verified Node', org: 'Verified Organisation', gov: 'Government Verified' };
            const tipLabel   = isVerified
                ? (authorProfile.verifiedType || '').split(';').map(t => tipMap[t.trim()] || t.trim()).filter(Boolean).join(' · ')
                : '';

            const ts    = data.createdAt ? timeAgo(data.createdAt.toDate()) : 'just now';
            const liked = likedPostIds.has(id);

            card.innerHTML = `
                <div class="flex items-start gap-3 mb-3">
                    <a href="/profile/?uid=${encodeURIComponent(data.authorUid)}" class="avatar flex-shrink-0"></a>
                    <div>
                        <div class="flex items-center gap-1.5 flex-wrap">
                            <a href="/profile/?uid=${encodeURIComponent(data.authorUid)}" class="text-sm font-bold text-white hover:opacity-70">${esc(authorName)}</a>
                            ${badge ? `<span class="verified-badge-wrap" data-tip="${esc(tipLabel)}">${badge}</span>` : ''}
                        </div>
                        <p class="text-[10px] mono mt-0.5" style="color:var(--text-dim)">${esc(authorUsername)} · ${ts}</p>
                    </div>
                </div>
                <p class="text-sm leading-relaxed post-content" style="color:var(--text-dim)"></p>
                <div class="flex gap-4 mt-4 pt-3" style="border-top: 1px solid rgba(255,255,255,0.04)">
                    <button data-post-id="${id}" class="like-btn text-[11px] font-semibold hover:opacity-70 transition-opacity"
                            style="color:${liked ? 'var(--accent)' : 'var(--text-dim)'}">↑ <span class="like-count">${data.likes || 0}</span></button>
                </div>
            `;

            // Set avatar content via DOM (avoids XSS via URL interpolation)
            const avatarLink = card.querySelector('.avatar');
            if (authorProfile?.avatarUrl) {
                avatarLink.style.background = 'none';
                avatarLink.style.padding    = '0';
                const img = document.createElement('img');
                img.className = 'w-full h-full rounded-full object-cover';
                img.alt       = '';
                img.src       = authorProfile.avatarUrl;
                avatarLink.appendChild(img);
            } else {
                avatarLink.textContent = avatarInitials;
            }

            card.querySelector('.post-content').textContent = data.content;

            card.querySelector('.like-btn').addEventListener('click', async (e) => {
                const likeBtn = e.currentTarget;
                if (!currentUser) { window.location.href = '/login/'; return; }
                likeBtn.disabled = true;
                const likeDocId    = `${id}_${currentUser.uid}`;
                const likeRef      = doc(db, "post_likes", likeDocId);
                const msgRef       = doc(db, "messages", id);
                const alreadyLiked = likedPostIds.has(id);
                try {
                    const batch = writeBatch(db);
                    if (alreadyLiked) {
                        batch.delete(likeRef);
                        batch.update(msgRef, { likes: increment(-1) });
                    } else {
                        batch.set(likeRef, { uid: currentUser.uid, postId: id, createdAt: serverTimestamp() });
                        batch.update(msgRef, { likes: increment(1) });
                    }
                    await batch.commit();
                    if (alreadyLiked) {
                        likedPostIds.delete(id);
                        likeBtn.style.color = 'var(--text-dim)';
                        const countEl = likeBtn.querySelector('.like-count');
                        countEl.textContent = Math.max(0, parseInt(countEl.textContent, 10) - 1);
                    } else {
                        likedPostIds.add(id);
                        likeBtn.style.color = 'var(--accent)';
                        const countEl = likeBtn.querySelector('.like-count');
                        countEl.textContent = parseInt(countEl.textContent, 10) + 1;
                    }
                } catch (err) {
                    console.error("Like failed:", err);
                } finally {
                    likeBtn.disabled = false;
                }
            });

            return card;
        }

        // ── Compose ───────────────────────────────────────────────────────────
        document.getElementById('compose-btn').addEventListener('click', async () => {
            if (!currentUser || !currentProfile) return;

            const input = document.getElementById('compose-input');
            const text  = input.value.trim();
            if (!text) return;

            const btn = document.getElementById('compose-btn');
            btn.disabled    = true;
            btn.textContent = "Transmitting...";

            try {
                await addDoc(collection(db, "messages"), {
                    authorUid:      currentUser.uid,
                    authorName:     currentProfile.displayName,
                    authorUsername: currentProfile.username,
                    authorInitials: currentProfile.avatarInitials,
                    content:        text,
                    likes:          0,
                    createdAt:      serverTimestamp()
                });
                input.value = '';
            } finally {
                btn.disabled    = false;
                btn.textContent = "Transmit";
            }
        });

        // ── Helpers ───────────────────────────────────────────────────────────
        function esc(str) {
            const d = document.createElement('div');
            d.textContent = str || '';
            return d.innerHTML;
        }

        function timeAgo(date) {
            const diff = Math.floor((Date.now() - date.getTime()) / 1000);
            if (diff < 60)   return diff + 's ago';
            if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
            if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
            return Math.floor(diff / 86400) + 'd ago';
        }
    </script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js');
        }
    </script>
</body>
</html>
